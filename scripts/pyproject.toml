[project]
name = "avicull-exporter"
version = "0.1.0"
description = "One-time ONNX and safetensors model exporter for avicull"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "onnx>=1.15.0",
    "safetensors>=0.4.0",
    "ultralytics>=8.3.0",
    "open-clip-torch>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
