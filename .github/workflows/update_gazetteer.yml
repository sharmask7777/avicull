name: Update Global Gazetteer & Regional Checklists

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-gazetteer:
    name: Build & Verify Gazetteer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Gazetteer Builder
        run: |
          python3 scripts/build_gazetteer.py

      - name: Verify Gazetteer & Regional Checklist Tests
        run: |
          pytest tests/test_build_gazetteer.py

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(gazetteer): monthly update of global gazetteer and checklists"
          title: "chore(gazetteer): update global gazetteer & regional checklists"
          body: |
            Automated monthly build of `data/gazetteer.json` and `data/regional_checklists.json`.
            Verified by `tests/test_build_gazetteer.py`.
          branch: "update-gazetteer-monthly"
          delete-branch: true
