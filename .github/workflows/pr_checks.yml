name: PR Sanity Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-format:
    name: Code Formatting, Lints & Cargo Deny
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run compiler check on all targets (cargo check)
        run: cargo check --all-targets

      - name: Run Clippy linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check supply-chain advisories, bans, and licenses (cargo deny check)
        run: cargo deny check

      - name: Check Rust documentation (cargo doc)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  test-rust:
    name: Rust Test Suite & Invariants
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Run full Rust test suite and verify blocking coverage gate
        run: cargo llvm-cov nextest --fail-under-lines 80 --lib --test test_suite --test test_mock_directory_structure_e2e

  python-and-gazetteer:
    name: Python Verification & Coverage Gate
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Python Verification Suite (ruff, mypy, pytest with coverage gate)
        run: ./scripts/verify_python.sh

  build-sanity:
    name: Release Build Sanity Check
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked
