[package]
name = "avicull"
version = "0.2.37"
edition = "2021"
authors = ["avicull contributors"]
description = "Local AI Bird Photo Organizer for macOS Apple Silicon"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
walkdir = "2.5"
blake3 = "1.5"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
nom-exif = "2.0"
kamadak-exif = "0.6"
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
tempfile = "3.13"
libc = "0.2"
opendal = { version = "0.59.5", features = ["services-s3", "services-fs"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "io-util", "signal"] }
dav-server = "0.11.0"
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"

[dev-dependencies]
proptest = "1.12.0"

[[bin]]
name = "avicull"
path = "src/main.rs"

[lib]
name = "avicull"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
redundant_clone = "deny"

# Sensible pedantic overrides to avoid counter-productive noise:
doc_markdown = "allow"             # LaTeX math symbols $I_m$ & complex eBird slugs trigger false positives
similar_names = "allow"            # e.g. is_y_m vs is_d_m or lat/lon coordinates
too_many_lines = "allow"           # Complex parsing loops & CLI match statements
cast_possible_truncation = "allow" # Image coordinates & thumbnail resizing downcasts
cast_possible_wrap = "allow"       # Inode u64 to SQLite i64 conversions
cast_sign_loss = "allow"           # Image bounding box f32 to u32 coordinates
cast_precision_loss = "allow"      # Float conversions in math/confidence scaling
module_name_repetitions = "allow"  # e.g. CatalogItem in catalog module
must_use_candidate = "allow"       # Pure helpers where discarding return value is fine
missing_errors_doc = "allow"       # Many private or internal helpers
missing_panics_doc = "allow"       # Internal helpers
struct_excessive_bools = "allow"   # Option flags in CLI structures
needless_raw_string_hashes = "allow" # SQLite schema strings
implicit_hasher = "allow"          # Standard collections without generic hashers

# Optimized build profiles
[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

# Tiered dev profile dependency optimization:
# opt-level = 1 on general dependencies minimizes cold LLVM compilation time in CI,
# while opt-level = 2 is selectively retained for compute bottlenecks (image decoding & cryptographic hashing).
[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
