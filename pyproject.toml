[project]
name = "avicull"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".superpowers",
    "docs",
    "target",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "BLE",    # flake8-blind-except
    "ERA",    # eradicate (removes commented-out code / agent scratchpads)
    "RUF",    # ruff-specific rules
    "PIE",    # flake8-pie
    "T10",    # flake8-debugger
    "FA",     # flake8-future-annotations
    "TRY",    # tryceratops exception handling
]
ignore = [
    "TRY002", # Allow standard built-in exception types where appropriate
    "TRY003", # Allow concise custom error message strings in exceptions
    "TRY301", # Allow abstract raise inside conditional blocks
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

# ========================================================
# ARCHITECTURAL CONTRACTS (import-linter)
# ========================================================
[tool.importlinter]
root_packages = ["scripts"]

[[tool.importlinter.contracts]]
name = "Data prep pipelines must not depend on heavy inference runtime"
type = "forbidden"
source_modules = [
    "scripts.build_gazetteer",
    "scripts.build_taxonomy_embeddings",
    "scripts.export_models",
]
forbidden_modules = [
    "scripts.infer",
]

[[tool.importlinter.contracts]]
name = "Independent scripts must remain modular and cycle-free"
type = "independence"
modules = [
    "scripts.build_gazetteer",
    "scripts.build_taxonomy_embeddings",
    "scripts.export_models",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_python"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/test_export_mock.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
